apiVersion: v1
kind: Service
metadata:
  labels:
    app: mongo-express-service
  name: mongo-express-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30000
  selector:
    app: mongo-express
status:
  loadBalancer: {}
